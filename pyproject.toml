[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "arbiter"
version = "0.1.0"
description = "Agentic Credit-Risk Governance Platform"
requires-python = ">=3.10"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
extend-select = ["I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.10"
files = ["src/"]
ignore_missing_imports = true
explicit_package_bases = true
namespace_packages = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
no_implicit_reexport = true
strict_equality = true
# warn_return_any and disallow_any_generics disabled — many third-party
# stubs legitimately use Any and this causes excessive noise in CI.
warn_return_any = false
disallow_any_generics = false
# Allow untyped decorators from third-party libraries (prefect, fastapi, etc.)
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = [
    "feast.*",
    "evidently.*",
    "fairlearn.*",
    "shap.*",
    "mlflow.*",
    "prefect.*",
    "langgraph.*",
    "langchain_core.*",
    "langchain_groq.*",
    "langchain.*",
    "dvc.*",
    "supabase.*",
    "gotrue.*",
    "postgrest.*",
    "realtime.*",
    "storage3.*",
    "xgboost.*",
    "lightgbm.*",
    "yaml.*",
    "ormsgpack.*",
    "redis.*",
    "httpx.*",
    "prometheus_client.*",
]
ignore_missing_imports = true

# ── Pytest ──────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
# Comprehensive filterwarnings — most third-party deprecations are suppressed
# here so CI output stays clean.  The conftest.py module-level filters cover
# warnings that fire BEFORE pytest's catch_warnings context is active.
filterwarnings = [
    # ── Pydantic v1→v2 migration from third-party libs (mlflow gateway, etc.) ──
    "ignore:Pydantic V1 style.*validators are deprecated:DeprecationWarning",
    "ignore:.*@validator.*deprecated.*:DeprecationWarning",
    "ignore:.*@root_validator.*deprecated.*:DeprecationWarning",
    "ignore:Support for class-based.*config.*deprecated:DeprecationWarning",

    # ── Prefect: field name 'schema' shadows attribute ──
    "ignore:Field name .schema. in .* shadows an attribute:UserWarning",

    # ── FastAPI / httpx / Starlette ──
    "ignore:.*httpx.*starlette.*:UserWarning",
    "ignore:.*httpx.*starlette.*:DeprecationWarning",

    # ── asyncio event loop (Python 3.10+) ──
    "ignore:.*no current event loop.*:DeprecationWarning",

    # ── anyio BlockingPortal alias (Starlette TestClient) ──
    "ignore:.*BlockingPortal.*deprecated.*:DeprecationWarning",
    "ignore:.*anyio.abc.BlockingPortal.*:DeprecationWarning",

    # ── MLflow model registry stage deprecation ──
    "ignore:.*get_latest_versions.*deprecated.*:FutureWarning",
    "ignore:.*MlflowClient.get_latest_versions.*:FutureWarning",

    # ── fairlearn: DataFrameGroupBy.apply (pandas 2.x) ──
    "ignore:.*DataFrameGroupBy\\.apply.*:DeprecationWarning",

    # ── supabase: gotrue package renamed to supabase_auth ──
    "ignore:.*gotrue.*deprecated.*:DeprecationWarning",
    "ignore:.*`gotrue` package is deprecated.*:DeprecationWarning",
]

