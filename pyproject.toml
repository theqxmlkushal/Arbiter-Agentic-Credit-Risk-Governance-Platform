[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "arbiter"
version = "0.1.0"
description = "Agentic Credit-Risk Governance Platform"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
extend-select = ["I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/"]
ignore_missing_imports = true
explicit_package_bases = true
namespace_packages = true
warn_return_any = true
warn_unused_configs = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_reexport = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "feast.*",
    "evidently.*",
    "fairlearn.*",
    "shap.*",
    "mlflow.*",
    "prefect.*",
    "langgraph.*",
    "langchain_groq.*",
    "dvc.*",
    "supabase.*",
    "xgboost.*",
    "lightgbm.*",
]
ignore_missing_imports = true

# ── Pytest ──────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
# Note: most filterwarnings are injected via conftest.py pytest_configure()
# because they need to survive pytest's catch_warnings context during collection.
filterwarnings = [
    # Prefect wraps user flows into internal Pydantic models; the field name
    # "schema" shadows a parent attribute — harmless and outside our control.
    "ignore:Field name .schema. in .* shadows an attribute:UserWarning",
    # FastAPI TestClient uses httpx; Starlette plans to swap to httpx2.
    "ignore:.*httpx.*starlette.testclient.*:UserWarning",
    # pytest_asyncio calls asyncio.get_event_loop() which is deprecated in 3.10+
    "ignore:.*no current event loop.*:DeprecationWarning",
]
