# ──────────────────────────────────────────────────────────────────────────────
# Arbiter CI Pipeline
#
# Job graph:  lint → typecheck → test → build (main only)
#
# Dependency strategy:
#   lint         — ruff only (no project deps needed)
#   typecheck    — requirements-typecheck.txt (minimal; mypy ignore_missing_imports
#                  covers everything else)
#   test         — requirements-ci.txt (full test deps minus feast/dvc/redis which
#                  are mocked; avoids boto3/fsspec conflict from feast+dvc together)
#   build        — no Python deps (Docker build only)
#
# Required GitHub Actions secrets:
#   GITHUB_TOKEN — built-in; used to push images to ghcr.io (packages: write).
# ──────────────────────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  PYTHON_VERSION: "3.10"
  REGISTRY: ghcr.io
  IMAGE_API: ghcr.io/${{ github.repository_owner }}/arbiter-api
  IMAGE_WORKER: ghcr.io/${{ github.repository_owner }}/arbiter-worker
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_COLOR: "1"
  # Silence pip's "new version available" nag
  PIP_QUIET: "1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── 1. Lint ───────────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install ruff
        run: pip install ruff==0.8.4

      - name: Ruff — lint check
        run: ruff check .

      - name: Ruff — format check
        run: ruff format --check src/ tests/

  # ─── 2. Typecheck ──────────────────────────────────────────────────────────
  typecheck:
    name: Typecheck (mypy)
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-typecheck.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-typecheck.txt

      - name: Run mypy
        # pythonpath=. lets mypy resolve src.* without an editable install
        run: MYPYPATH=. mypy src/

  # ─── 3. Test ───────────────────────────────────────────────────────────────
  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    needs: [typecheck]

    # Placeholder secrets so pydantic-settings doesn't raise ValidationError
    # when src/config.py is imported (fields have no default).
    env:
      SUPABASE_URL: "http://localhost:54321"
      SUPABASE_KEY: "ci-test-key"
      GROQ_API_KEY: "ci-test-key"
      MLFLOW_TRACKING_URI: "sqlite:///mlflow_ci.db"
      FEAST_REPO_PATH: "."
      PRODUCTION_MODEL_URI: "models:/credit_champion/Production"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Run pytest
        run: |
          pytest tests/ -v --tb=short \
            --cov=src --cov-report=term-missing --cov-report=xml \
            -W default

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 7

  # ─── 4. Build & Push (main branch only) ───────────────────────────────────
  build:
    name: Build & Push Docker images
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.IMAGE_API }}
            ${{ env.IMAGE_WORKER }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.api
          push: true
          tags: |
            ${{ env.IMAGE_API }}:${{ github.sha }}
            ${{ env.IMAGE_API }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Worker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.worker
          push: true
          tags: |
            ${{ env.IMAGE_WORKER }}:${{ github.sha }}
            ${{ env.IMAGE_WORKER }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deployment summary
        run: |
          echo "API image:    ${{ env.IMAGE_API }}:${{ github.sha }}"
          echo "Worker image: ${{ env.IMAGE_WORKER }}:${{ github.sha }}"
