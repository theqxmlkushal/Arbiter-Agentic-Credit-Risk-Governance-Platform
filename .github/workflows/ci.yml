# ──────────────────────────────────────────────────────────────────────────────
# Arbiter CI Pipeline
#
# Job graph:  lint → typecheck → test → build (main only)
#
# Required GitHub Actions secrets:
#   GHCR_TOKEN — A PAT (or GITHUB_TOKEN with write:packages) for pushing
#                Docker images to ghcr.io.  If using the built-in
#                GITHUB_TOKEN, ensure the workflow has permissions: packages: write.
# ──────────────────────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write          # needed for the build job to push to ghcr.io

env:
  PYTHON_VERSION: "3.10"
  REGISTRY: ghcr.io
  IMAGE_API: ghcr.io/${{ github.repository_owner }}/arbiter-api
  IMAGE_WORKER: ghcr.io/${{ github.repository_owner }}/arbiter-worker

# ── Concurrency ─────────────────────────────────────────────────────────────
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# ── Jobs ────────────────────────────────────────────────────────────────────
jobs:
  # ─── 1. Lint ───────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ruff
        run: pip install ruff

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check src/ tests/

  # ─── 2. Typecheck ──────────────────────────────────────────────────────
  typecheck:
    name: Typecheck (mypy)
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run mypy
        run: mypy src/

  # ─── 3. Test ───────────────────────────────────────────────────────────
  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    needs: [typecheck]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v --tb=short -W default

  # ─── 4. Build & Push (main branch only) ────────────────────────────────
  build:
    name: Build & Push Docker images
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]       # gate on all three passing
    if: github.ref == 'refs/heads/main'  # only on main branch pushes
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.IMAGE_API }}
            ${{ env.IMAGE_WORKER }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.api
          push: true
          tags: |
            ${{ env.IMAGE_API }}:${{ github.sha }}
            ${{ env.IMAGE_API }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Worker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.worker
          push: true
          tags: |
            ${{ env.IMAGE_WORKER }}:${{ github.sha }}
            ${{ env.IMAGE_WORKER }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Print image digests
        run: |
          echo "API image pushed:   ${{ env.IMAGE_API }}:${{ github.sha }}"
          echo "Worker image pushed: ${{ env.IMAGE_WORKER }}:${{ github.sha }}"
