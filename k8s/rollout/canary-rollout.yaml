apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: credit-model-rollout
  labels:
    app: arbiter-api
    tier: serving
spec:
  replicas: 3
  selector:
    matchLabels:
      app: arbiter-api
  template:
    metadata:
      labels:
        app: arbiter-api
        tier: serving
    spec:
      containers:
        - name: credit-model
          image: ghcr.io/arbiter/arbiter-api:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: arbiter-config
            - secretRef:
                name: arbiter-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
  strategy:
    canary:
      canaryService: arbiter-api-canary
      stableService: arbiter-api-stable
      analysis:
        templates:
          - templateName: error-rate-analysis
        startingStep: 2
        args:
          - name: service-name
            value: arbiter-api-canary
      steps:
        - setWeight: 5
        - pause: { duration: 60s }
        - setWeight: 25
        - pause: { duration: 120s }
        - setWeight: 100
---
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: error-rate-analysis
spec:
  args:
    - name: service-name
  metrics:
    - name: error-rate
      interval: 30s
      count: 5
      successCondition: result[0] < 0.02
      provider:
        prometheus:
          address: http://prometheus.monitoring.svc:9090
          query: |
            sum(rate(http_requests_total{service="{{args.service-name}}",status=~"5.."}[2m]))
            /
            sum(rate(http_requests_total{service="{{args.service-name}}"}[2m]))
    - name: fairness-drift
      interval: 60s
      count: 3
      successCondition: result[0] < 0.1
      provider:
        prometheus:
          address: http://prometheus.monitoring.svc:9090
          query: |
            fairness_demographic_parity_difference{service="{{args.service-name}}"}
