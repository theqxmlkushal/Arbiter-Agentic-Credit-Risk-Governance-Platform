apiVersion: apps/v1
kind: Deployment
metadata:
  name: arbiter-api
  labels:
    app: arbiter-api
    tier: serving
spec:
  replicas: 2
  selector:
    matchLabels:
      app: arbiter-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: arbiter-api
        tier: serving
    spec:
      containers:
        - name: api
          image: ghcr.io/arbiter/arbiter-api:latest
          ports:
            - containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: arbiter-config
            - secretRef:
                name: arbiter-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
